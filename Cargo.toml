[package]
name = "tenrai"
version = "1.3.0"
edition = "2024"
description = "Bindings for the Tenrai API."
readme = "Readme.md"
homepage = "https://github.com/dragmine149/Tenrai_rs"
repository = "https://github.com/dragmine149/Tenrai_rs"
license-file = "LICENSE"
keywords = ["Jikan", "MAL", "MyAnimeList", "Tenrai"]
exclude = ["tests/"]

[features]
default = ["auto_retry"]
auto_retry = []
custom = []
log = ["dep:log"]
rate = []
strict = []

[lib]
doctest = false

[dependencies]
# Used for caching data
bytes = "1.12"
dirs = "7.0"

# Used for parsing data
regex = "1.13"
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
strum = "0.28"
strum_macros = "0.28"

# Used for macros / building front-end code
derive_builder = "0.20"
pastey = "0.2"
sealed = "0.7"

# Used for making the requests
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1.54", features = ["macros", "rt"] }

# Optional for features
log = { version = "0.4", optional = true }

[dev-dependencies]
# Used for testing
rand = { version = "0.10" }
tokio = { version = "1.54", features = ["rt-multi-thread"] }
