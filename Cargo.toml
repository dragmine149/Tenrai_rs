[package]
name = "tenrai"
version = "1.0.0"
edition = "2024"
readme = "Readme.md"

[lib]
doctest = false

[dependencies]
bytes = "1.12"
derive_builder = "0.20"
dirs = "7.0.0"
log = { version = "0.4.34", optional = true }
pastey = "0.2.3"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["serde_derive"] }
serde_json = "1.0"
strum = "0.28.0"
strum_macros = "0.28.0"
tokio = { version = "1.53.2", features = ["macros", "rt"] }

[dev-dependencies]

[features]
default = ["auto_retry"]
auto_retry = []
custom = []
log = ["dep:log"]
rate = []
